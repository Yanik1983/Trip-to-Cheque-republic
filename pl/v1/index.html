<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poland Family Trip</title><style>/* Layout: one reading column (trail-guide feel), wide tables scroll inside their own boxes; region colours borrow Czech KČT trail blazes */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --ink: #1c2320; --muted: #59645d; --line: #d6ddd6;
  --accent: #1d6a4f; --link: #1b5c86; --est: #9a5800; --est-bg: #fbefdc; --live-bg: #e2f1ea; --mix-bg: #e7eaf4; --mix: #3c4a86;
  --best: #edf6f0; --shadow: 0 1px 2px rgba(20, 40, 30, .06);
  --t-red: #c8102e; --t-blue: #1f5fb0; --t-green: #2e8540; --t-yellow: #e2b000; --t-white: #ffffff;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201c; --ink: #e5ebe7; --muted: #a2aea7; --line: #2b3530;
    --accent: #62c39b; --link: #86c0ea; --est: #f0b45e; --est-bg: #3a2c14; --live-bg: #143326; --mix-bg: #20263e; --mix: #aab6f0;
    --best: #16261e; --shadow: none; --t-white: #e9ece9; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201c; --ink: #e5ebe7; --muted: #a2aea7; --line: #2b3530;
  --accent: #62c39b; --link: #86c0ea; --est: #f0b45e; --est-bg: #3a2c14; --live-bg: #143326; --mix-bg: #20263e; --mix: #aab6f0;
  --best: #16261e; --shadow: none; --t-white: #e9ece9; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 44px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.55rem; padding-bottom: 8px; border-bottom: 2px solid var(--ink); margin-bottom: 14px; }
h3 { font-size: 1.2rem; margin: 22px 0 10px; }
h4 { font-size: 1.05rem; }
p { margin: 0 0 10px; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
small { color: var(--muted); }
.eyebrow { font: 600 .78rem/1.3 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.lede { font-size: 1.12rem; max-width: 68ch; margin-top: 10px; }
.top { display: grid; gap: 14px; }
.wrap > *, .top > *, .day > *, section { min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.facts > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.facts span { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts b { font: 500 1.35rem/1.2 var(--f-data); font-variant-numeric: tabular-nums; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; }
.legend { font-size: .9rem; color: var(--muted); }
.tag { display: inline-block; font: 500 .66rem/1 var(--f-data); letter-spacing: .04em; padding: 3px 5px; border-radius: 3px; vertical-align: 2px; white-space: nowrap; }
.tag.live { background: var(--live-bg); color: var(--accent); }
.tag.est { background: var(--est-bg); color: var(--est); }
.tag.mix { background: var(--mix-bg); color: var(--mix); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 11px; border-bottom: 1px solid var(--line); }
thead th { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg); white-space: nowrap; }
tbody th { font-weight: 600; }
tfoot th, tfoot td { border-bottom: 0; background: var(--bg); }
td.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
tr.best > * { background: var(--best); }
tr.best th { box-shadow: inset 4px 0 0 var(--accent); }
.note { font-size: .88rem; color: var(--muted); margin-top: 10px; }
.verdict { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--surface); }
.flights { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.flight { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.fl-top { display: flex; justify-content: space-between; font-weight: 600; }
.fl-no { font-family: var(--f-data); }
.fl-times { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.fl-times b { font: 500 1.6rem/1 var(--f-data); display: block; }
.fl-times span { color: var(--muted); font-size: .85rem; }
.fl-line { border-top: 2px dashed var(--line); text-align: center; padding-top: 4px; }
.fl-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: .88rem; color: var(--muted); }
.fl-foot b { color: var(--ink); font-family: var(--f-data); }
.bag { margin-top: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.bag .sum { margin: 8px 0 0; font-size: 1.05rem; }
.trails { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: .92rem; }
.trails span { display: inline-flex; gap: 6px; align-items: center; }
.blaze { flex: none; display: inline-grid; width: 30px; height: 30px; background: var(--t-white); border: 1px solid var(--line); border-radius: 3px; place-items: center; }
.blaze i { width: 100%; height: 33%; display: block; }
.trails .blaze { width: 20px; height: 20px; }
.b-red i { background: var(--t-red); } .b-blue i { background: var(--t-blue); } .b-green i { background: var(--t-green); } .b-yellow i { background: var(--t-yellow); }
.day { padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.day-h { display: flex; gap: 12px; align-items: flex-start; }
.day-h .eyebrow { margin-bottom: 2px; }
.route { font-size: .92rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 0; }
.route b { font-family: var(--f-data); font-weight: 500; }
.route span { color: var(--muted); }
.plan { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 75ch; }
.night { font-size: .95rem; margin: 0; }
.atts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 6px; }
.att { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; box-shadow: var(--shadow); min-width: 0; }
.att-body { padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.ph { margin: 0; position: relative; background: var(--line); }
.ph img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; max-width: 100%; }
.ph figcaption { font-size: .72rem; padding: 4px 8px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.ph figcaption a { color: var(--muted); }
.ph.sm img { width: 132px; height: auto; aspect-ratio: 4 / 3; }
.ph.sm figcaption { width: 132px; font-size: .66rem; }
.rating { display: inline-flex; gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); font-size: .88rem; }
.rating b { font: 500 1.05rem var(--f-data); color: var(--accent); }
.rating span { color: var(--muted); }
.att dl, .kv { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: .9rem; }
.att dt, .kv dt { color: var(--muted); font-weight: 600; }
.att dd, .kv dd { margin: 0; min-width: 0; }
.kids { font-size: .9rem; margin: 0; }
.links { font-size: .86rem; margin: 0; }
table.hotels td, table.hotels th { vertical-align: middle; }
.hph { width: 140px; }
.hotel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; margin-top: 18px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.hotel-ph { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-width: 0; }
.hotel-body { display: grid; gap: 6px; align-content: start; min-width: 0; }
.alt { font-size: .9rem; padding: 8px 10px; background: var(--bg); border-radius: 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.cols > div { min-width: 0; }
.dns { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.dn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.dn ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 5px; font-size: .92rem; }
.srcs { columns: 2 320px; font-size: .88rem; padding-left: 18px; }
.srcs li { break-inside: avoid; margin-bottom: 4px; }
.next { margin-top: 18px; padding: 16px; border: 2px solid var(--accent); border-radius: 8px; background: var(--surface); }
.next h3 { margin-top: 0; }
@media (max-width: 720px) {
  .hotel { grid-template-columns: 1fr; }
  .atts { grid-template-columns: 1fr; }
  .fl-times b { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.ph.noimg img { display: none; }
.ph.noimg::before { content: "Photo couldn't load here – open the source link below"; display: grid; place-items: center; aspect-ratio: 3 / 2; font-size: .85rem; color: var(--muted); padding: 12px; text-align: center; }

.dbar { display: flex; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.dbar a.dest { flex: 1 1 0; min-width: 90px; text-align: center; padding: 8px 10px; border-radius: 7px; text-decoration: none; color: var(--ink); font-weight: 600; display: grid; line-height: 1.2; }
.dbar a.dest span[lang="en"] { font-size: .78rem; color: var(--muted); font-weight: 500; }
.dbar a.dest[aria-current="page"] { background: var(--accent); color: #fff; }
.dbar a.dest[aria-current="page"] span[lang="en"] { color: rgba(255,255,255,.85); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dbar a.dest[aria-current="page"] { color: #0c1a14; } :root:not([data-theme="light"]) .dbar a.dest[aria-current="page"] span[lang="en"] { color: rgba(12,26,20,.8); } }
.dbar a.dest:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
